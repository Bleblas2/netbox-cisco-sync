[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "netbox-cisco-sync"
version = "1.0.1"
authors = [
    { name = "Lukasz Luczak", email = "bleblas@gmail.com" },
]
description = "Synchronize Cisco platform inventory into NetBox."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["netbox", "netbox-plugin", "Cisco", "Catalyst Center", "SD-WAN", "vManage", "Meraki", "network-automation", "ipam", "dcim"]
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/bleblas2/netbox-cisco-sync"
Repository = "https://github.com/bleblas2/netbox-cisco-sync.git"
Issues = "https://github.com/bleblas2/netbox-cisco-sync/issues"

[tool.setuptools.packages.find]
include = ["netbox_cisco_sync*"]

[tool.setuptools.package-data]
netbox_cisco_sync = [
    "templates/netbox_cisco_sync/*.html",
    "templates/netbox_cisco_sync/buttons/*.html",
    "templates/netbox_cisco_sync/inc/*.html",
]
